<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish | MC Serverlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="brand">
      <div class="block"></div>
    </div>
    <h1 class="pixel">ADMIN KIRISH</h1>
    <div class="error-box" id="errorBox"></div>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Parol</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Kirish</button>
    </form>
    <p class="hint" style="text-align:center; margin-top:16px;"><a href="/">← Ommaviy sahifaga qaytish</a></p>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'none';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorBox.textContent = data.error || 'Kirishda xatolik';
      errorBox.style.display = 'block';
      return;
    }
    window.location.href = '/admin';
  } catch (err) {
    errorBox.textContent = 'Server bilan bog\'lanishda xatolik';
    errorBox.style.display = 'block';
  }
});
</script>
</body>
</html>
